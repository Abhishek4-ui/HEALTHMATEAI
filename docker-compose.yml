version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healthmate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthmate_ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - healthmate-net

  redis:
    image: redis:7.2-alpine
    container_name: healthmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis_data:/data
    networks:
      - healthmate-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthmate-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/healthmate_ai
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - redis
    networks:
      - healthmate-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: healthmate-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - healthmate-net

volumes:
  mongodb_data:
  redis_data:

networks:
  healthmate-net:
    driver: bridge
