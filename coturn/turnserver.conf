# =====================================================================
# HealthMate AI - Coturn WebRTC STUN/TURN Server Configuration
# RFC 5766, RFC 6156, RFC 8489 Compliant
# =====================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Public IP address of the TURN server (replace with actual EC2/VPS public IP)
# external-ip=YOUR_PUBLIC_IP

# Use long-term credential mechanism with shared secret (HMAC-SHA1)
use-auth-secret
static-auth-secret=healthmate_coturn_super_secret_shared_hmac_key_2026

# Realm for authentication (matches frontend/backend domain)
realm=healthmate.ai

# Relay IP
relay-ip=0.0.0.0

# Port range for media relay
min-port=49152
max-port=65535

# Fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver.log

# Security & Anti-abuse
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
